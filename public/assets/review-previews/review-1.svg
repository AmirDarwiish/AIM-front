<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100"><style>text{font-family:Arial,sans-serif;fill:#1b251f;text-anchor:start;direction:rtl;unicode-bidi:embed}</style>
<rect width="900" height="1100" fill="#edf1ed"/><rect x="48" y="48" width="804" height="1004" rx="24" fill="#fff"/>
<rect x="90" y="90" width="720" height="70" rx="8" fill="#eef1eb"/><text x="778" y="136" font-size="29">نموذج عرض • محتوى توضيحي</text>
<text style="direction:ltr;text-anchor:end" x="780" y="246" font-size="26" fill="#89704e">LA CONSTRUCTION</text>
<text x="780" y="317" font-size="42">وضوح من أول خطوة</text><path d="M120 362H780" stroke="#e5e9e2"/>
<circle cx="748" cy="430" r="30" fill="#edf1ed"/><text x="685" y="440" font-size="28">تجربة توضيحية 01</text>
<rect x="105" y="488" width="690" height="250" rx="18" fill="#edf1ed"/><text x="780" y="570" font-size="34">عرفنا نطاق الأعمال والخامات المطلوبة</text><text x="780" y="628" font-size="34">قبل التنفيذ، وكل خطوة كانت مفهومة.</text><text x="755" y="698" font-size="23" fill="#6c786d">رسالة توضيحية لعرض التصميم</text>
<text x="780" y="833" font-size="29">التفاصيل واضحة من البداية</text><text x="780" y="902" font-size="25" fill="#737b72">هذا المثال لا يمثل رأي عميل حقيقي.</text><text x="780" y="946" font-size="25" fill="#737b72">يُستبدل بمراجعة موثقة عند توفرها.</text>
<path d="M360 1010H540" stroke="#d9dfd5" stroke-width="5" stroke-linecap="round"/></svg>